name: The Wire (NBA news → Discord)

on:
  schedule:
    - cron: "*/15 * * * *"   # GitHub may run this a few minutes late; that's fine
  workflow_dispatch:
    inputs:
      dry:
        description: "Dry run (print, post nothing)"
        type: boolean
        default: false

concurrency:
  group: wire
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet feedparser==6.0.11 requests==2.32.3
      - name: Post new articles
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          WIRE_SHAMS_ROLE: ${{ vars.WIRE_SHAMS_ROLE }}
        run: python3 scripts/wire.py ${{ inputs.dry && '--dry' || '' }}
